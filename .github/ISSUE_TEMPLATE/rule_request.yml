name: Rule request
description: Propose a new check for risky agent-generated code or claims.
title: "rule: "
labels: [rule request]
body:
  - type: markdown
    attributes:
      value: |
        Great AgentProof rules are specific, hard to game, and useful in real PR review.
        Before opening a request, skim docs/RULE_TRIAGE.md so the proposal includes detection evidence, false-positive risk, and review value.
  - type: input
    id: rule-name
    attributes:
      label: Proposed rule name
      placeholder: security.client-side-admin-secret
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested category
      options:
        - security
        - verification
        - claims
        - ui
        - docs
        - policy
        - supply-chain
        - other
    validations:
      required: true
  - type: textarea
    id: why-it-matters
    attributes:
      label: Why this matters in AI-agent PRs
      description: Explain the real review risk this catches. Prefer concrete failure modes over general style preference.
    validations:
      required: true
  - type: textarea
    id: bad-example
    attributes:
      label: Bad example
      description: Show the smallest code, config, or claim that should trigger this rule.
      render: text
    validations:
      required: true
  - type: textarea
    id: good-example
    attributes:
      label: Good example
      description: Show the safer pattern AgentProof should encourage.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected finding
      description: What should AgentProof say, and what should it suggest?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: evidence-source
    attributes:
      label: Detection evidence
      description: Where should AgentProof detect this?
      options:
        - Static file scan
        - Verification command output
        - Agent final claim
        - Config or docs metadata
        - GitHub/CI context
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: local-only
    attributes:
      label: Can this be detected locally without network access?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: false-positives
    attributes:
      label: Likely false positives
      description: Where might this rule be noisy or unfair?
    validations:
      required: false
  - type: textarea
    id: detection-notes
    attributes:
      label: Detection notes
      description: Optional implementation hints, patterns, file types, or edge cases.
    validations:
      required: false
