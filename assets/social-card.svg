<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AgentProof social card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#081827"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="signalA" cx="18%" cy="18%" r="74%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="0.58" stop-color="#0f172a" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signalB" cx="86%" cy="10%" r="58%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#cbd5e1" stroke-opacity="0.075"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#signalA)"/>
  <rect width="1200" height="630" fill="url(#signalB)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g opacity="0.65">
    <path d="M90 536C198 470 275 490 374 520C480 552 556 545 664 488C778 428 881 426 1058 486" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M70 96C202 160 322 144 422 108C536 68 674 84 780 138C892 194 978 204 1128 134" fill="none" stroke="#34d399" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <rect x="62" y="58" width="1076" height="514" rx="42" fill="#07111f" fill-opacity="0.82" stroke="#dbeafe" stroke-opacity="0.18" filter="url(#softShadow)"/>

  <g transform="translate(100 96)">
    <rect width="182" height="42" rx="21" fill="#dcfce7" fill-opacity="0.12" stroke="#86efac" stroke-opacity="0.42"/>
    <circle cx="27" cy="21" r="7" fill="#86efac"/>
    <text x="48" y="27" fill="#bbf7d0" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800">AGENTPROOF</text>
  </g>

  <text x="100" y="214" fill="#f8fafc" font-family="Space Grotesk, Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="800" letter-spacing="-4.8">Your agent says</text>
  <text x="100" y="296" fill="#f8fafc" font-family="Space Grotesk, Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="800" letter-spacing="-4.8">"ready to ship".</text>
  <text x="100" y="374" fill="#93c5fd" font-family="Space Grotesk, Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-3.2">AgentProof asks for receipts.</text>

  <text x="104" y="438" fill="#cbd5e1" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">Local QA gate for AI-generated pull requests</text>

  <g transform="translate(100 482)">
    <rect width="232" height="50" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.42"/>
    <text x="22" y="32" fill="#e0f2fe" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">npx agentproof</text>
  </g>
  <g transform="translate(350 482)">
    <rect width="172" height="50" rx="15" fill="#dc2626"/>
    <text x="23" y="32" fill="#fff" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">DO NOT SHIP</text>
  </g>

  <g transform="translate(748 94)">
    <rect width="322" height="426" rx="28" fill="#020617" stroke="#dbeafe" stroke-opacity="0.2"/>
    <rect x="22" y="24" width="278" height="74" rx="18" fill="#111827" stroke="#64748b" stroke-opacity="0.22"/>
    <text x="42" y="54" fill="#94a3b8" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">agent final claim</text>
    <text x="42" y="80" fill="#f8fafc" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">"tests passed"</text>

    <path d="M161 114V146" stroke="#64748b" stroke-width="2" stroke-dasharray="5 7"/>
    <polygon points="161,154 152,140 170,140" fill="#64748b"/>

    <rect x="22" y="160" width="278" height="208" rx="18" fill="#07111f" stroke="#64748b" stroke-opacity="0.26"/>
    <text x="42" y="193" fill="#38bdf8" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">EVIDENCE CHECK</text>

    <g transform="translate(42 220)">
      <circle cx="10" cy="10" r="10" fill="#22c55e" fill-opacity="0.18"/>
      <path d="M5 10.5l3.2 3.3L15.5 6" fill="none" stroke="#86efac" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="16" fill="#e2e8f0" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">build observed</text>
    </g>

    <g transform="translate(42 262)">
      <circle cx="10" cy="10" r="10" fill="#ef4444" fill-opacity="0.2"/>
      <path d="M6 6l8 8M14 6l-8 8" stroke="#fecaca" stroke-width="2.4" stroke-linecap="round"/>
      <text x="30" y="16" fill="#e2e8f0" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">tests missing</text>
    </g>

    <g transform="translate(42 304)">
      <circle cx="10" cy="10" r="10" fill="#f97316" fill-opacity="0.2"/>
      <path d="M10 4v8M10 16h.01" stroke="#fed7aa" stroke-width="2.6" stroke-linecap="round"/>
      <text x="30" y="16" fill="#e2e8f0" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">secret pattern</text>
    </g>

    <rect x="22" y="386" width="278" height="18" rx="9" fill="#dc2626" fill-opacity="0.36"/>
    <rect x="22" y="386" width="78" height="18" rx="9" fill="#ef4444"/>
    <text x="42" y="344" fill="#fecaca" font-family="Azeret Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800">FAIL 37/100</text>
  </g>
</svg>
